name: NSE Data + Indicators

on:
  schedule:
    # All times are UTC. India (IST) = UTC + 5:30. NSE closes at 15:30 IST = 10:00 UTC.
    # Format: minute hour day-of-month month day-of-week
    - cron: "45 10 * * 1-5"   # main run   : 16:15 IST, Monday-Friday
    - cron: "30 13 * * 1-5"   # backup run : 19:00 IST (adds nothing if the main run worked)
  workflow_dispatch:           # "Run workflow" button in the Actions tab

concurrency:
  group: nse-pipeline
  cancel-in-progress: false

permissions:
  contents: write              # lets the job commit new data back to the repo

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-data.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-data.txt
          pip install git+https://github.com/rongardF/tvdatafeed.git

      - name: 1. Download latest candles
        run: python main.py

      - name: 2. Calculate indicators
        shell: bash
        run: |
          python calculate_indicators.py
          mkdir -p reports
          cp data_quality_report_5m.csv reports/
          {
            echo "### Data quality (5-minute data)"
            echo '```'
            python -c "import pandas as pd; print(pd.read_csv('reports/data_quality_report_5m.csv').to_string(index=False))"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 3. AI steps (build dataset, train, evaluate) will be added here later.

      - name: Commit new data and quality report
        if: always()           # save whatever was downloaded even if some steps failed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Nothing new to commit (market holiday, or backup run)."
          else
            git commit -m "Market data $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi
